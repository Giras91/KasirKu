name: CI - JDK 17 Build

on:
  push:
    branches:
      - main
      - docs/add-instrumentation-test-readme
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Assemble Debug (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute for gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
